[project]
name = "replaykit"
version = "0.3.0"
description = "Replayable incident benchmark for on-call AI agents"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
